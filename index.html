<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diner Fries | DJ + Sax</title>
  <meta name="description" content="Diner Fries: a DJ and saxophone duo for weddings and events.">
  <style>
    :root {
      --bg: #000000;
      --cyan: #27c4f4;
      --yellow: #fcef45;
      --pink: #cd4e9c;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 6vh, 3.5rem);
      padding: 2rem 1.5rem;
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .logo {
      width: min(78vw, 46vh, 440px);
      height: auto;
      display: block;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .btn {
      display: inline-block;
      min-width: 12rem;
      padding: 0.95rem 2rem;
      border: 2px solid transparent;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #000;
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-primary:hover { box-shadow: 0 0 18px rgba(252, 239, 69, 0.6); }
    .btn-secondary:hover { background: var(--cyan); color: #000; box-shadow: 0 0 18px rgba(39, 196, 244, 0.6); }

    .btn:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main style="display:contents">
    <img class="logo" src="logo.svg" alt="Diner Fries">

    <div class="actions">
      <a class="btn btn-primary"
         href="https://www.instagram.com/diner.fries/"
         target="_blank" rel="noopener">See us on Instagram</a>

      <a class="btn btn-secondary"
         href="mailto:jordan@hesterdesigns.com?subject=Diner%20Fries%20-%20Requesting%20Information">Email us</a>
    </div>
  </main>
</body>
</html>
